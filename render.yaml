services:
  - type: web
    name: project-eleven
    runtime: static
    buildCommand: npm ci --include=dev && npm run typecheck && npm run lint && npm test && npm run build
    staticPublishPath: out
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
